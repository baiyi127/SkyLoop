name: Flow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flow-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check workflow state transitions
        run: dotnet run --project tests/FlowChecks/FlowChecks.csproj -c Release
