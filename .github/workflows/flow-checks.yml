name: Flow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flow-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check workflow state transitions
        run: dotnet run --project tests/FlowChecks/FlowChecks.csproj -c Release
      - name: Check NPC turn-in request validation
        run: dotnet run --project tests/TurnInRequestChecks/TurnInRequestChecks.csproj -c Release
      - name: Check macro result target and baseline
        run: dotnet run --project tests/MacroResultChecks/MacroResultChecks.csproj -c Release
      - name: Check selected recipe window reuse
        run: dotnet run --project tests/PreparationChecks/PreparationChecks.csproj -c Release
      - name: Check crafting exit before navigation
        run: dotnet run --project tests/CraftExitChecks/CraftExitChecks.csproj -c Release
      - name: Check owned purchase confirmation
        run: dotnet run --project tests/PurchaseChecks/PurchaseChecks.csproj -c Release
      - name: Check saved navigation approach points and cancellation
        run: dotnet run --project tests/NavigationChecks/NavigationChecks.csproj -c Release
      - name: Check currency affordability and cap headroom
        run: dotnet run --project tests/CurrencyPolicyChecks/CurrencyPolicyChecks.csproj -c Release
      - name: Check fixed Firmament NPC interaction spots
        run: dotnet run --project tests/FirmamentLocationChecks/FirmamentLocationChecks.csproj -c Release
